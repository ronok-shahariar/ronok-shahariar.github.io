# Welcome to Jekyll!
# Site-wide configuration file.
# Note: Jekyll does not reload this file automatically. 
# Restart docker compose after saving changes.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Md. Shahariar Hassan Ronok"
title_separator          : "-"
name                     : &name "Md. Shahariar Hassan Ronok"
description              : &description "Research Portfolio — Computer Systems, Microarchitecture & Wireless Networks"
url                      : "https://ronok-shahariar.github.io"
baseurl                  : ""
repository               : "ronok-shahariar/ronok-shahariar.github.io"

# Site Author
author:
  name             : "Md. Shahariar Hassan Ronok"
  avatar           : "profile.jpg"
  bio              : "B.Sc. in ECE (RUET) | Embedded Systems & High-Speed Networking Engineer"
  location         : "Dhaka, Bangladesh"
  employer         : "Siliconova"
  employer_url     : "https://siliconova.com/"
  uri              : "https://ronok-shahariar.github.io"
  email            : "346ronokarya@gmail.com"
  github           : "https://github.com/ronok-shahariar"
  linkedin         : "https://www.linkedin.com/in/md-shahariar-hasan-ronok-b2237a174/"


# Publication Category Headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Theses & Manuscripts'
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   : 
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

atom_feed:
  hide                   : true     # Hides RSS feed in footer
  path                   :

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion & Markdown Processing
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Collection Defaults (Social Share disabled everywhere)
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false

  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: false

  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development